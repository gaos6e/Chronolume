name: Build and verify Windows distributions

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing Release tag to receive the verified Windows assets
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify optional Release target
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag differs from the source version.' }
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git diff --name-only "$tagCommit...HEAD" -- package.json package-lock.json src-tauri ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { throw "Release source differs in app-affecting paths: $changes" }

      - name: Verify release source
        shell: pwsh
        run: |
          npm run check:versions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke Windows distributions
        shell: pwsh
        run: |
          npm run tauri:build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-portable.ps1
          if (-not $?) { throw 'Portable packaging failed.' }
          ./scripts/smoke-distributions.ps1 -ReportPath artifacts/windows-smoke.json
          if (-not $?) { throw 'Windows distribution smoke failed.' }
          ./scripts/stage-windows-artifacts.ps1 -SmokeReportPath artifacts/windows-smoke.json
          if (-not $?) { throw 'Windows artifact staging failed.' }

      - name: Upload verified Windows distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chronolume-windows-release
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Append verified assets to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts/windows -File | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
